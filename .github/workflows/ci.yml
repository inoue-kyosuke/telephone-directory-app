# プルリクエスト時: 型チェックとテスト
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # lint（Format の崩れも含む）・型チェック・テストをまとめて実行する
      - run: npm run check
